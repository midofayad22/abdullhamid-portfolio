<svg
  width="512"
  height="512"
  viewBox="0 0 512 512"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- Main teal gradient -->
    <linearGradient
      id="tealGradient"
      x1="90"
      y1="420"
      x2="410"
      y2="70"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#05665F"/>
      <stop offset="0.45" stop-color="#0A9A8C"/>
      <stop offset="1" stop-color="#35D0BF"/>
    </linearGradient>


    <!-- Gold gradient -->
    <linearGradient
      id="goldGradient"
      x1="120"
      y1="390"
      x2="410"
      y2="110"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#8E6A2F"/>
      <stop offset="0.45" stop-color="#C7A557"/>
      <stop offset="0.75" stop-color="#F0D78A"/>
      <stop offset="1" stop-color="#B98B3E"/>
    </linearGradient>


    <!-- Background gradient -->
    <radialGradient
      id="backgroundGradient"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(256 210) rotate(90) scale(300)"
    >
      <stop offset="0" stop-color="#123C37"/>
      <stop offset="0.48" stop-color="#082B27"/>
      <stop offset="1" stop-color="#041B19"/>
    </radialGradient>


    <!-- Teal glow -->
    <radialGradient
      id="tealGlow"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(170 150) rotate(45) scale(230)"
    >
      <stop offset="0" stop-color="#22CFC0" stop-opacity=".32"/>
      <stop offset="1" stop-color="#22CFC0" stop-opacity="0"/>
    </radialGradient>


    <!-- Gold glow -->
    <radialGradient
      id="goldGlow"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(375 355) rotate(45) scale(180)"
    >
      <stop offset="0" stop-color="#D9B45F" stop-opacity=".24"/>
      <stop offset="1" stop-color="#D9B45F" stop-opacity="0"/>
    </radialGradient>


    <!-- Shadow / glow -->
    <filter
      id="logoGlow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        stdDeviation="7"
        result="blur"
      />

      <feColorMatrix
        in="blur"
        type="matrix"
        values="
          0 0 0 0 0.04
          0 0 0 0 0.65
          0 0 0 0 0.58
          0 0 0 .55 0
        "
      />
    </filter>


    <!-- Clip -->
    <clipPath id="roundedShape">
      <rect
        x="18"
        y="18"
        width="476"
        height="476"
        rx="108"
      />
    </clipPath>

  </defs>


  <!-- =========================================
       BACKGROUND
  ========================================== -->

  <g clip-path="url(#roundedShape)">

    <rect
      x="18"
      y="18"
      width="476"
      height="476"
      rx="108"
      fill="url(#backgroundGradient)"
    />


    <!-- Teal atmospheric glow -->
    <circle
      cx="150"
      cy="135"
      r="220"
      fill="url(#tealGlow)"
    />


    <!-- Gold atmospheric glow -->
    <circle
      cx="385"
      cy="375"
      r="180"
      fill="url(#goldGlow)"
    />


    <!-- Subtle geometric lines -->

    <path
      d="M35 370L180 225"
      stroke="#35D0BF"
      stroke-opacity=".08"
      stroke-width="1"
    />

    <path
      d="M120 495L475 140"
      stroke="#D9B45F"
      stroke-opacity=".07"
      stroke-width="1"
    />

    <path
      d="M45 145L180 280"
      stroke="#35D0BF"
      stroke-opacity=".06"
      stroke-width="1"
    />

    <circle
      cx="390"
      cy="115"
      r="78"
      stroke="#35D0BF"
      stroke-opacity=".07"
      stroke-width="1"
    />

    <circle
      cx="390"
      cy="115"
      r="110"
      stroke="#D9B45F"
      stroke-opacity=".045"
      stroke-width="1"
    />

  </g>


  <!-- =========================================
       A GLOW
  ========================================== -->

  <path
    d="
      M145 390
      L238 118
      L274 118
      L367 390
      L326 390
      L301 316
      L211 316
      L187 390
      Z

      M224 277
      L288 277
      L256 181
      Z
    "
    fill="#12B8AA"
    opacity=".5"
    filter="url(#logoGlow)"
  />


  <!-- =========================================
       MAIN A MONOGRAM
       CUSTOM DRAWN PATH
  ========================================== -->

  <path
    d="
      M145 390

      L238 118
      L274 118

      L367 390

      L326 390

      L301 316

      L211 316

      L187 390

      Z

      M224 277

      L288 277

      L256 181

      Z
    "
    fill="url(#tealGradient)"
    fill-rule="evenodd"
    clip-rule="evenodd"
  />


  <!-- =========================================
       GOLD CROSSBAR
  ========================================== -->

  <path
    d="
      M208 292
      L304 292
      L293 316
      L218 316
      Z
    "
    fill="url(#goldGradient)"
  />


  <!-- =========================================
       GOLD EDGE DETAIL
  ========================================== -->

  <path
    d="
      M238 118
      L274 118
      L367 390
      L349 390
      L262 145
      L238 118
      Z
    "
    fill="url(#goldGradient)"
    opacity=".72"
  />


  <!-- =========================================
       TEAL OVERLAY TO KEEP A SHAPE CLEAN
  ========================================== -->

  <path
    d="
      M238 118
      L256 118
      L187 390
      L145 390
      Z
    "
    fill="#087C72"
    opacity=".72"
  />


  <!-- =========================================
       INNER A HIGHLIGHT
  ========================================== -->

  <path
    d="
      M256 181
      L288 277
      L274 277
      L256 222
      L238 277
      L224 277
      Z
    "
    fill="#8FE6DC"
    opacity=".42"
  />


  <!-- =========================================
       SMALL GOLD ACCENT
  ========================================== -->

  <circle
    cx="361"
    cy="130"
    r="5"
    fill="#D9B45F"
  />

  <circle
    cx="361"
    cy="130"
    r="11"
    stroke="#D9B45F"
    stroke-opacity=".22"
    stroke-width="1"
  />


  <!-- =========================================
       BORDER
  ========================================== -->

  <rect
    x="18.5"
    y="18.5"
    width="475"
    height="475"
    rx="107.5"
    stroke="url(#goldGradient)"
    stroke-opacity=".45"
    stroke-width="1"
  />


  <!-- Inner border -->

  <rect
    x="28"
    y="28"
    width="456"
    height="456"
    rx="99"
    stroke="#5ED8CC"
    stroke-opacity=".10"
    stroke-width="1"
  />

</svg>